<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Silly Cam</title>
<style>

  button { font: inherit; border: 0; background: none; color: inherit; cursor: pointer; padding: 0; }

  #stage { position: fixed; inset: 0; }

  video { display: none; }

  /* start / error screen */
  #start { position: fixed; inset: 0; z-index: 20; background: var(--yellow); color: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 30px; text-align: center; }
  #start .faces { font-size: 64px; letter-spacing: 6px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
  #start h1 { margin: 0; font-size: 46px; font-weight: 900; letter-spacing: -1px; }
  #startBtn { background: #111; color: #fff; font-size: 24px; font-weight: 900; padding: 20px 38px; border-radius: 999px; box-shadow: 0 6px 0 rgba(0,0,0,.25); }
  #startBtn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #start .note { font-size: 15px; font-weight: 700; opacity: .65; max-width: 300px; line-height: 1.4; }
  #start .err { font-size: 18px; font-weight: 800; max-width: 320px; line-height: 1.4; }

  /* top bar */
  #flipBtn { position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 5; width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: 26px; display: grid; place-items: center; }

  #hint { position: fixed; top: 38%; left: 50%; transform: translateX(-50%); z-index: 4; background: rgba(0,0,0,.45); padding: 12px 20px; border-radius: 999px; font-weight: 800; font-size: 18px; white-space: nowrap; transition: opacity .3s; pointer-events: none; }

  /* filter name popup */
  #name { position: fixed; left: 50%; bottom: calc(215px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 5; font-size: 22px; font-weight: 900; text-shadow: 0 2px 8px rgba(0,0,0,.5); transition: opacity .3s; pointer-events: none; white-space: nowrap; }

  #tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding-bottom: max(22px, env(safe-area-inset-bottom)); }
  #ring { position: absolute; left: 50%; bottom: calc(max(22px, env(safe-area-inset-bottom)) - 9px); width: 96px; height: 96px; margin-left: -48px; border-radius: 50%; border: 6px solid #fff; pointer-events: none; box-shadow: 0 0 16px rgba(0,0,0,.25); }

<script type="module">
import { createStage3D, FILTERS_3D, PHONE } from './filters3d.js';

import { FACE_POSITIONS } from './facemesh.js';

// Everything runs on this device. The camera picture is never sent anywhere;

// ---------- face tracking (MediaPipe, loaded in the background) ----------
async function loadFaceTracker() {

    const { FilesetResolver, ImageSegmenter } = vision;

    // Faces and hands are looked for in a background worker (tracker-worker.js), so tracking never
    // holds up the camera picture. If workers don't work here, the same thing runs on this page instead.
    landmarker = await startWorkerTracker(V, 'main').catch((e) => { console.warn('Tracking worker unavailable, tracking on the page', e); return startPageTracker(vision, files); });
    // The group finder gets its own worker, so the main face tracker can keep up with every camera frame.
    if (landmarker.worker) startWorkerTracker(V, 'finders').then((f) => (finderTracker = f)).catch((e) => console.warn('Group finder unavailable', e));

    // hands never holds up the picture. They can't share the face trackers' worker. If workers don't work
    // here, hands are looked for on this page (GPU measured faster there: 8–19ms vs 20–36ms on CPU).
    const handOpts = (d) => ({
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d },
      runningMode: 'VIDEO', numHands: 2,

      console.warn('Hand worker unavailable, looking for hands on the page', e);
      vision.HandLandmarker.createFromOptions(files, handOpts('GPU')).catch(() => vision.HandLandmarker.createFromOptions(files, handOpts('CPU')))
        .then((h) => (handTracker = h)).catch((e2) => console.warn('Hand tracking unavailable', e2));
    });

    const segOpts = (d) => ({

        try {

        } catch (e) { console.warn('Skin finder warm-up skipped', e); }

    try { stage3d = await createStage3D(gl, { picture: base }); /* the camera picture, so 3D filters match the room's light */ stage3d.setFilter(FILTERS[current]); }
    catch (e) { console.warn('3D unavailable', e); }

    console.warn('Face tracking unavailable', e);

// ---------- geometry helpers ----------
// Maps the video frame onto the screen like CSS object-fit: cover (mirrored for selfies).
function frameFit() {

  const mirror = facing === 'user';
  const P = (i) => {
    let x = lm[i].x * vw; const y = lm[i].y * vh;

    return { x: x * s + ox, y: y * s + oy };

  const w = Math.hypot(b.x - a.x, b.y - a.y);
  const angle = Math.atan2(b.y - a.y, b.x - a.x);

  return { P, w, h, angle, top, chin, nose: P(1), mouthOpen: lip / h > 0.07, lipTop: P(13), lipBottom: P(14), eyes: lm.length > 473 ? [P(468), P(473)] : [P(159), P(386)], eyeMid: mid(P(33), P(263)), cheeks: [P(205), P(425)] };

const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

function along(f, anchor, dx, dy) {

function ellipse(ctx, x, y, rx, ry, rot, fill) {

// Magnify a circle of the picture (used for Big Eyes). Zooms straight from the camera so it stays sharp.
function bulge(x, y, r, zoom) {

  bctx.save(); bctx.beginPath(); bctx.arc(x, y, r, 0, Math.PI * 2); bctx.clip();
  if (facing === 'user') { bctx.translate(W, 0); bctx.scale(-1, 1); x = W - x; }
  bctx.drawImage(video, (x - sr - ox) / s, (y - sr - oy) / s, sr * 2 / s, sr * 2 / s, x - r, y - r, r * 2, r * 2);

// Face tracking looks at a small copy of the frame, so a sharp 4K camera doesn't slow it down.
function trackingFrame() {
  const vw = video.videoWidth || video.width, vh = video.videoHeight || video.height;
  const k = Math.min(1, 640 / Math.max(vw, vh)); // plenty for finding faces, and fast
  const w = Math.round(vw * k), h = Math.round(vh * k);
  if (track.width !== w || track.height !== h) { track.width = w; track.height = h; }
  tctx.drawImage(video, 0, 0, w, h);
  return track;
}

// ---------- hands ----------
// Hands let you touch the 3D filters. Looking for hands costs time, so: every 2nd frame while a
// hand is in view, and only every 4th frame (still ~8 times a second) when there are none.
let handTracker = null, lastHands = null, handsAt = 0, handFrame = 0, handTs = 0, handVideoTime = -1;

function runHands(now) {

  if (handBusy && now - handSentAt < 1000) return; // the worker is still looking (never wait forever on a lost answer)
  handVideoTime = video.currentTime;
  const seeing = lastHands?.landmarks?.length > 0;
  if (handFrame++ % (PHONE ? (handOnFace ? 2 : seeing ? 3 : 6) : (handOnFace ? 1 : seeing ? 2 : 4))) return; // every frame while touching your face (phones: half as often)

    handBusy = true; handSentAt = now;
    createImageBitmap(trackingFrame()).then((b) => handWorker.post({ type: 'hands', ts: handTs, bitmap: b }, [b])).catch(() => { handBusy = false; });

}

  handBusy = false;

// ---------- tracking worker ----------
// The page sends the worker one small copy of a camera frame at a time and keeps drawing while it
// works. A new frame is only sent once the last answer is back, so if tracking is slow it skips
// frames (filters keep gliding on the last pose) instead of falling further and further behind.

const trackerReady = { faces: false, finders: false };
function startWorkerTracker(V, role) {
  return new Promise((resolve, reject) => {

    const timer = setTimeout(() => { w.terminate(); reject(new Error('worker took too long')); }, 30000);

    runningMode: 'VIDEO', numFaces: 5, outputFaceBlendshapes: true, outputFacialTransformationMatrixes: true,
  });

    post(msg) {

// Send the current camera frame (plus, now and then, one group-finder slice) to be tracked.

// One camera start at a time: a second request just waits for the one already happening.
let starting = null;
function startCamera() {
  return (starting ||= openCamera().finally(() => { starting = null; }));
}
async function openCamera() {
  stream?.getTracks().forEach((tr) => tr.stop());
  // 1080p is sharp on phones and laptops; 4K looked about the same but made computers run hot and slow.
  // Phones held upright hand back a tall picture. Cameras that can't do 1080p just give their best.
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: facing, width: { ideal: PHONE ? 1280 : 1920 }, height: { ideal: PHONE ? 720 : 1080 }, frameRate: { ideal: 30, max: 30 }, resizeMode: { ideal: 'none' }, // phones: 720p is plenty on their screen, and much less work
    } });
  } catch (e) {
    if (e.name !== 'OverconstrainedError') throw e;
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facing } });
  }
  autoAdjust(stream.getVideoTracks()[0]);
  video.srcObject = stream;
  try { await video.play(); }
  catch (e) { if (e.name !== 'AbortError') throw e; await video.play(); } // interrupted by a reload: just play again
  watchFrames();
}
// Keep focus, brightness and colour adjusting on their own, where the camera supports it.
function autoAdjust(track) {
  const caps = track?.getCapabilities?.() || {}, adv = {};
  for (const k of ['focusMode', 'exposureMode', 'whiteBalanceMode']) if (caps[k]?.includes('continuous')) adv[k] = 'continuous';
  if (Object.keys(adv).length) track.applyConstraints({ advanced: [adv] }).catch(() => {});
}
$('#flipBtn').onclick = async () => {
  facing = facing === 'user' ? 'environment' : 'user';
  try { await startCamera(); } catch { facing = 'user'; await startCamera(); }
};
$('#startBtn').onclick = async () => {
  $('#startBtn').textContent = 'Starting… 📷';
  try {
    if (!navigator.mediaDevices?.getUserMedia) throw new Error('nocam');
    await startCamera();
  } catch (e) {
    $('#startBtn').textContent = 'Try again 📷';
    $('#startNote').outerHTML = `<div class="err" id="startNote">${
      e.name === 'NotAllowedError' ? '🙈 The camera is turned off for this app.<br>Ask a grown-up to allow the camera, then try again!'
      : e.name === 'NotFoundError' || e.message === 'nocam' ? '📷 No camera found on this device.'
      : '😕 The camera is busy or not working. Try again!'}</div>`;
    return;
  }
  $('#start').classList.add('hidden');
  started = true;
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  $('#flipBtn').classList.toggle('hidden', cams.length < 2);
  select(1);
  $('#shutter').classList.remove('hidden');
  $('#name').textContent = 'Tap 📸 to take a photo!';
  clearTimeout(nameTimer); nameTimer = setTimeout(() => ($('#name').style.opacity = 0), 3000);
};

resize();
select(0, false);
loadFaceTracker();
requestAnimationFrame(render);
window.__silly = { FILTERS, select, frame, takePhoto, useSource(src) { video = src; lastVideoTime = -1; watchFrames(); },
  // One deterministic step for tests: track the current camera frame, wait for the answer, then draw with it.
  async step() {
    if (!landmarker || !needsFace(FILTERS[current])) { frame(performance.now()); return faces.length; }
    const wait = (p) => Promise.race([p, new Promise((r) => setTimeout(r, 5000))]); // never hang a test
    if (trackerBusy) await wait(nextTrackResult());

    frame(performance.now()); return faces.length;
  }, get trackCost() { return trackCost; }, get frameCost() { return frameCost; }, get landmarker() { return landmarker; }, get lastResult() { return lastResult; }, get stage3d() { return stage3d; }, get lastHands() { return lastHands; }, get handMask() { return handMask; }, get handOnFace() { return handOnFace; }, get handCover() { return handCover; }, get tongues() { return tongues; }, // test hooks
   get faces() { return faces; }, get faceStatus() { return faceStatus; } };
</script>
